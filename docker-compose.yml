# Запуск усієї системи однією командою:  docker compose up --build
# Порти і назва файлу БД беруться з .env (див. .env.example); без .env діють значення після ":-".
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-8080}:8080"          # ліворуч — порт на хості, праворуч — порт у контейнері
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__AppDb=Data Source=/app/data/${DB_FILE:-app.db}
      - Database__MigrateOnStartup=true
      - Cors__WebOrigin=http://localhost:${WEB_PORT:-8090}
    volumes:
      - ./docker-data:/app/data            # файл SQLite живе на хості, а не в шарі контейнера
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    ports:
      - "${WEB_PORT:-8090}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - Api__BaseUrl=http://api:8080       # усередині мережі compose хост — це ім'я сервісу, а не localhost
    depends_on:
      - api
    restart: unless-stopped
